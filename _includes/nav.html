<header class="nav" id="top">
  <nav class="nav__inner" aria-label="Primary">
    <a class="nav__brand" href="{{ '/' | relative_url }}">{{ site.data.profile.hero.name }}</a>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span class="nav__toggle-bar"></span>
      <span class="nav__toggle-bar"></span>
    </button>
    <ul class="nav__menu" id="nav-menu">
      {% for link in site.data.navigation.main %}
      {% assign is_page = false %}
      {% unless link.url contains "#" %}{% if page.url == link.url %}{% assign is_page = true %}{% endif %}{% endunless %}
      <li><a href="{{ link.url | relative_url }}"{% if is_page %} class="is-active" aria-current="page"{% endif %}>{{ link.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
