name: Sync Google Scholar

on:
  schedule:
    - cron: "0 8 * * *"   # daily, 08:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - google_scholar_crawler/**
      - .github/workflows/google_scholar_crawler.yaml

permissions:
  contents: write

concurrency:
  group: google-scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar profile
        env:
          # Override in Settings -> Secrets and variables -> Actions -> Variables
          GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID || '9GlGW1MAAAAJ' }}
          # Google Scholar blocks GitHub's IPs; a free ScraperAPI key makes the
          # sync reliable. Add it in Settings -> Secrets and variables -> Actions.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python google_scholar_crawler/main.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- _data/scholar.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.json
          git commit -m "Update publications from Google Scholar"
          # main may have moved while the sync ran; rebase our one commit onto it.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1
